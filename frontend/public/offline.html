<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Run Community Kenya Offline</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7faf8;
        color: #17201f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        display: grid;
        gap: 12px;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: 2.2rem;
        line-height: 1;
      }

      p {
        margin: 0;
        color: #52635f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Open Run Community Kenya again when your connection returns. Active activities and pending uploads are stored on this device.</p>
    </main>
  </body>
</html>
